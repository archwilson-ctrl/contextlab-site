{{ define "main" }}
  <section class="content">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}{{ . }}{{ end }}
  </section>

  <section class="list">
    {{ range .Pages }}
      <article class="list-item">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <div class="meta">{{ .Date.Format "2006-01-02" }}{{ with .Params.status }} · {{ . }}{{ end }}</div>
        <p class="muted">{{ .Summary }}</p>
      </article>
    {{ end }}
  </section>
{{ end }}
